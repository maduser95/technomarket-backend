<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — ТехноМаркет</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; color: #333; margin: 0; padding: 0; }
        
        /* Стили для красивой верхней шапки */
        .site-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #ffffff; border-bottom: 1px solid #eaeaea; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .site-header nav { display: flex; gap: 18px; }
        .site-header a { text-decoration: none; color: #495057; font-weight: 600; font-size: 14px; transition: color 0.2s; }
        .site-header a:hover { color: #007bff; }

        /* Контейнер для двух колонок: формы и таблицы */
        .admin-main-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 25px; max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* Блок заказов на всю ширину снизу */
        .admin-bottom-zone { max-width: 1200px; margin: 0 auto 40px auto; padding: 0 20px; }

        .admin-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #444; }
        .form-group input, .form-group textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .btn-submit { background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-submit:hover { background: #218838; }

        /* Красивые кнопки управления в таблице */
        .btn-action { color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; display: block; width: 100%; margin: 5px 0; font-size: 13px; text-align: center; text-decoration: none; }
        .btn-edit { background: #ffa500; }
        .btn-edit:hover { background: #e09200; }
        .btn-delete { background: #ff4d4d; }
        .btn-delete:hover { background: #e63939; }
    </style>
</head>
<body>

<!-- ВЕРХНЯЯ ШАПКА: Сюда скрипт гарантированно добавит кнопку без багов -->
<header class="site-header">
    <div style="display: flex; align-items: center; gap: 25px;">
        <span style="font-size: 18px; font-weight: bold; color: #222;">ТехноМаркет</span>
        <nav>
            <a href="index.html">Каталог</a>
            <a href="cart.html">Корзина</a>
            <a href="admin.html" style="color: #007bff;">Админка</a>
        </nav>
    </div>
    <div id="auth-nav-zone">
        <!-- Сюда вставится кнопка Войти -->
    </div>
</header>

<!-- ОСНОВНАЯ СЕТКА: Форма слева, Таблица справа -->
<main class="admin-main-grid">
    
    <!-- Левая колонка: Форма -->
    <div class="admin-card">
        <h2 id="form-title" style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">🛠 Добавление товара</h2>
        <form id="admin-form" onsubmit="handleAdminFormSubmit(event)" enctype="multipart/form-data">
            <div class="form-group">
                <label>Название техники:</label>
                <input type="text" id="prod-name" name="name" required placeholder="Например: Видеокарта">
            </div>
            <div class="form-group">
                <label>Цена (руб):</label>
                <input type="number" id="prod-price" name="price" required placeholder="Например: 65000">
            </div>
            <div class="form-group">
                <label>Описание товара:</label>
                <textarea id="prod-desc" name="desc" rows="4" placeholder="Краткие характеристики девайса..."></textarea>
            </div>
            <div class="form-group">
                <label>Изображение товара (файл):</label>
                <input type="file" id="prod-image" name="productImage" accept="image/*">
            </div>
            <button type="submit" class="btn-submit">Загрузить на сайт</button>
        </form>
    </div>

    <!-- Правая колонка: Таблица товаров -->
    <div class="admin-card">
        <h2 style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">📦 Управление товарами</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
                <tr style="background: #f4f4f4; text-align: left;">
                    <th style="padding: 12px; border-bottom: 2px solid #ddd;">Товар</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ddd;">Цена</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ddd; text-align: center; width: 140px;">Действие</th>
                </tr>
            </thead>
            <tbody id="admin-products-list">
                <!-- Строки вставит JS -->
            </tbody>
        </table>
    </div>
</main>

<!-- ЗОНА ЗАКАЗОВ СНИЗУ -->
<div class="admin-bottom-zone">
    <div class="admin-card">
        <h2 style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">📋 Управление заказами клиентов</h2>
        <div id="orders-container">
            <!-- Сюда вставятся заказы -->
        </div>
    </div>
</div>

<!-- Модальное окно авторизации (скопировано для этой страницы) -->
<div id="auth-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 10000;">
    <div style="background: #fff; padding: 30px; border-radius: 16px; width: 100%; max-width: 360px; box-shadow: 0 10px 35px rgba(0,0,0,0.15); position: relative;">
        <button onclick="closeAuthModal()" style="position: absolute; top: 12px; right: 15px; background: none; border: none; font-size: 28px; cursor: pointer; color: #bbb;">&times;</button>
        <div style="display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; gap: 10px;">
            <button id="tab-login" class="active" onclick="switchAuthTab('login')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #007bff; border-bottom: 2px solid #007bff;">Вход</button>
            <button id="tab-register" onclick="switchAuthTab('register')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #888;">Регистрация</button>
        </div>
        <form id="user-login-form" onsubmit="handleUserLogin(event)">
            <div class="form-group"><label>Email:</label><input type="email" id="auth-login-email" required></div>
            <div class="form-group"><label>Пароль:</label><input type="password" id="auth-login-password" required></div>
            <button type="submit" class="btn-submit">Войти в профиль</button>
        </form>
        <form id="user-register-form" onsubmit="handleUserRegister(event)" style="display: none;">
            <div class="form-group"><label>Ваше имя:</label><input type="text" id="auth-reg-name" required></div>
            <div class="form-group"><label>Email:</label><input type="email" id="auth-reg-email" required></div>
            <div class="form-group"><label>Пароль:</label><input type="password" id="auth-reg-password" required></div>
            <button type="submit" class="btn-submit" style="background: #28a745;">Создать аккаунт</button>
        </form>
    </div>
</div>

<script>
    function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; switchAuthTab('login'); }
    function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
    function switchAuthTab(tab) {
        var loginForm = document.getElementById('user-login-form');
        var registerForm = document.getElementById('user-register-form');
        var tabLogin = document.getElementById('tab-login');
        var tabRegister = document.getElementById('tab-register');
        if (tab === 'login') {
            loginForm.style.display = 'block'; registerForm.style.display = 'none';
            tabLogin.style.color = '#007bff'; tabLogin.style.borderBottom = '2px solid #007bff';
            tabRegister.style.color = '#888'; tabRegister.style.borderBottom = 'none';
        } else {
            loginForm.style.display = 'none'; registerForm.style.display = 'block';
            tabRegister.style.color = '#28a745'; tabRegister.style.borderBottom = '2px solid #28a745';
            tabLogin.style.color = '#888'; tabLogin.style.borderBottom = 'none';
        }
    }
    document.addEventListener('click', function(e) { if (e.target === document.getElementById('auth-modal')) closeAuthModal(); });
</script>

<script src="script.js"></script>
</body>
</html>
